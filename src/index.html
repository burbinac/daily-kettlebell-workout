<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151A">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kettlebell">
<title>Daily Kettlebell Workout</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; padding: 0; background: #12151A; color: #F3F6FA; min-height: 100%; }
  body { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  #root { min-height: 100vh; width: 100%; max-width: 480px; margin: 0 auto; }
  /* On wide screens keep the app's fixed bars (menu, Start bar, session view) in the centered column. */
  @media (min-width: 520px) {
    #root [style*="position: fixed"] { left: calc(50% - 240px) !important; right: calc(50% - 240px) !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<noscript>This workout app needs JavaScript.</noscript>
<script src="app.js"></script>
</body>
</html>
